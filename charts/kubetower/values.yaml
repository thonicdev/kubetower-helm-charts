# KubeTower - the console in a pod.
#
# ---------------------------------------------------------------------------
# READ THIS FIRST
#
# By default this chart deploys the console's **server profile**:
# `serverProfile: true` below passes `--incluster`, which removes the local
# shell, the node shell and the assistant. Setting it false deploys the desktop
# profile on a machine that happens to be a pod, shell included. Neither
# setting makes it a shared multi-user console: the binary still has no per-user
# identity and no in-cluster client of its own (`InClusterConfig` appears in no
# non-test file). Everything that follows from that:
#
#   * With no identity provider: one password, one session, one identity.
#     There are no users. With `auth.oidc` set, people sign in as themselves
#     and each gets a session of their own - but see the next point, which
#     holds either way.
#   * Everything the console does, it does **as this pod's ServiceAccount**,
#     not as whoever signed in. The console does not yet ask the cluster
#     whether a person may do a thing, so whatever RBAC you grant below, you
#     grant to every person who can sign in - through the password or through
#     the identity provider alike.
#   * The port-forward cap is per-process. `forwardPorts` is shared by
#     everybody at once, not per person.
#   * Revoking access means changing the password and restarting, which signs
#     out everyone.
#
# So: install it for one operator, reachable by that operator. Do not put an
# Ingress with no authentication in front of it and hand the URL round.
# ---------------------------------------------------------------------------

image:
  # There is no published image. Nothing in thonicdev/kubetower pushes one:
  # `.github/workflows/release.yml` says "Not `packages`, because nothing
  # pushes an image", `security.yml` builds with `push: false`, and `ci.yml`
  # tags `kubetower:ci` locally and throws it away. You build it yourself, from
  # the repository's Dockerfile, and make it reachable from the cluster.
  repository: kubetower
  # Empty means the chart's appVersion, which is a placeholder. Set this.
  tag: ""
  # IfNotPresent so a locally built image is used where the node can already
  # see it (Docker Desktop, kind after `kind load`, minikube after
  # `minikube image load`). Change to Always once a registry exists.
  pullPolicy: IfNotPresent
  pullSecrets: []

# One by default. Above one, the chart also deploys a small Valkey (see
# `valkey` at the end of this file) through which the consoles share their
# sessions, confirmation plans and a short-lived marker per completed sign-in -
# so a session opened on one pod is valid on the next. A sign-in in progress
# travels in a sealed cookie in the browser, so it finishes through any pod.
#
# **What several replicas cost**, because it is not only more pods: each
# console's state directory is its own, so the console does not offer what only
# one pod could hold - the preference writes (rail, columns, density), the
# settings writes, the per-cluster extension switches and port-forwards are not
# registered, and the archive is off. Every replica draws the defaults.
#
# **Refused at install** rather than half-working: several replicas with
# `persistence.enabled` (one volume cannot be two consoles' state), with
# `serverProfile: false`, or with the shared password offered and no
# `auth.passwordHash` (each pod would draw its own).
replicaCount: 1

nameOverride: ""
fullnameOverride: ""

# ---------------------------------------------------------------------------
# How the pod reaches the API server
# ---------------------------------------------------------------------------
#
# The binary reads KUBECONFIG and nothing else - it has no in-cluster path. So
# the chart writes a kubeconfig that points at kubernetes.default.svc and uses
# the projected ServiceAccount token. That is the whole trick, and it is the
# reason this chart works at all.
kubeconfig:
  # false lets you mount your own kubeconfig instead (see extraVolumes /
  # extraEnv). Everything below is ignored then.
  generate: true
  # The name the console shows in its cluster list.
  contextName: in-cluster
  server: https://kubernetes.default.svc

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # The token is projected by the chart with a one-hour lifetime rather than
  # taken from the legacy auto-mounted Secret.
  automountToken: false

# ---------------------------------------------------------------------------
# RBAC - what the pod's ServiceAccount may do
# ---------------------------------------------------------------------------
#
# Read-only, cluster-wide, by default. Every rule is there because a page in
# the console reads it; templates/rbac.yaml names which page beside each one.
#
# Nothing here is cluster-admin, and the three dangerous capabilities are off:
# writing, exec, and the kubelet proxy. Turn one on only when you know that
# everybody with the console's password gets it.
rbac:
  create: true

  # get/list/watch on the built-in kinds the console lists. This is what makes
  # it useful and is safe to leave on - with the caveat that it includes
  # `secrets`, because the Config > Secrets page and the Helm release list both
  # read them. If that is not acceptable, set readSecrets: false and accept
  # that those two pages report a denial.
  #
  # **Every Secret includes this release's own**, which holds the session key
  # and any password hash. Anybody who can sign in can read the key from the
  # Secrets page and mint a session cookie of their own - one that survives a
  # password change and ends only when the key is rotated. A ClusterRole
  # cannot grant every Secret but one, so the chart does not pretend to: turn
  # readSecrets off, or bind a narrower role of your own instead. With
  # auth.oidc set, a minted session can carry any name, so the console's
  # record of who did what is only as good as that Secret is unread.
  read: true
  readSecrets: true

  # Custom resources. The console discovers every CRD the cluster serves and
  # renders it from the CRD's own printer columns, which cannot be expressed as
  # a fixed list - the only rule that covers it is a wildcard read. It is still
  # read-only, but it is a wildcard, so it is off by default and you turn it on
  # deliberately.
  customResources: false

  # create/update/patch/delete on workloads and config. Off. With this on, the
  # console's edit and delete buttons work - for everyone who can sign in.
  #
  # **Treat it as cluster-admin.** It grants `create` on pods, Secrets and
  # ServiceAccounts in every namespace. A pod can run as any ServiceAccount in
  # its namespace, so creating one borrows that account's rights - including
  # those of the controllers in kube-system. That is not a flaw in this list;
  # it is what "can create pods everywhere" means in Kubernetes.
  write: false

  # pods/exec and pods/portforward. Off. With this on, anybody with the
  # password gets a root-ish shell in any pod in the cluster, holding this
  # ServiceAccount. This is the single most expensive switch in the file.
  exec: false

  # nodes/proxy, which the kubelet-stats page uses for per-node usage where
  # there is no metrics-server. It is a proxy to every kubelet's API. Off.
  #
  # Only `get` is granted, and that is still enough to reach the kubelet's
  # own API; Kubernetes' RBAC guidance says access to nodes/proxy allows
  # running commands in any pod on the node. Treat it as a shell on every node.
  nodeProxy: false

  # metrics.k8s.io, for the CPU and memory columns. Harmless and useful, but it
  # only answers where metrics-server is installed.
  metrics: true

# ---------------------------------------------------------------------------
# The front door
# ---------------------------------------------------------------------------
# serverProfile passes --incluster to the console.
#
# **It removes routes; it adds nothing.** With it set, the console registers no
# local shell, no node shell and no assistant — the addresses do not exist rather
# than existing and refusing, which is the difference between a property of the
# router and a property of one code path.
#
# **On by default since 2026-09-22.** An in-cluster chart deploying the
# desktop profile had it the wrong way round: the shell it kept is a shell
# holding this pod's ServiceAccount, which reads every Secret the role allows
# whatever the rbac switches say. Off is still available and is now the
# decision somebody types.
#
# It makes the console smaller; it does not make it multi-user. A deployment
# shared between people still shares one password and one session.
serverProfile: true

auth:
  # The user name on the login form.
  user: admin

  # A **bcrypt hash**, never a password. Leave it empty and the binary draws a
  # password on first start, prints it once in the log and keeps only the hash
  # in the state directory - which means the state directory must persist, or
  # every restart draws a new one. NOTES.txt says how to read it.
  #
  # Generate one with:  htpasswd -nbBC 12 "" "yourpassword" | cut -c2-
  passwordHash: ""

  # Use a Secret you made yourself instead. It must carry KT_PASSWORD_HASH,
  # and it should carry KT_SESSION_SECRET, at least 32 characters. Without the
  # key the pod still starts, but the console draws a new one in memory at
  # every start - with or without persistence - so every restart, and every
  # rollout, signs everybody out. The chart cannot look inside a Secret it did
  # not write, so it cannot refuse the omission; NOTES repeats this instead.
  existingSecret: ""

  # The key that signs session cookies. Empty means: reuse the one already in
  # the release's Secret if there is one, otherwise draw a new one. Rotating it
  # signs everybody out, which is also the only way to revoke a session - the
  # token is stateless and Logout only drops the cookie.
  #
  # At least 32 characters. The console ignores a shorter key and draws its
  # own in memory, which would sign everybody out at every restart while the
  # values claim a fixed key - so the chart refuses a shorter one.
  #
  # Set it (or auth.existingSecret) when a tool renders this chart without a
  # cluster - `helm template`, Argo CD and other GitOps tools. The chart
  # keeps a drawn key across upgrades by reading it back from the cluster, and
  # those tools cannot, so they draw a new key on every render.
  sessionSecret: ""

  # Idle window, and the ceiling counted from login. The binary's own defaults
  # are 30 and 90 days, which are right for a laptop and long for something
  # reachable over the network - so the chart shortens them and says so.
  sessionTTL: 8h
  sessionMax: 24h

  # -------------------------------------------------------------------------
  # Single sign-on (OpenID Connect)
  # -------------------------------------------------------------------------
  #
  # Empty issuer means no identity provider: the password above is the only way
  # in, exactly as before. **Needs a console image built with single sign-on**
  # - one that knows KT_OIDC_ISSUER; an older image ignores every value here
  # and keeps the password.
  #
  # **Environment, never authorisation.** These values say who a person is. What
  # they may do is the cluster's RBAC, and this chart maps no group to any right:
  # a group reaches a right through a RoleBinding the cluster's owner writes.
  #
  # **Everybody the provider will issue a token to for this client is
  # admitted, with the pod's full rights.** The console keeps no list of who
  # may sign in, and until it asks the cluster what each person may do, every
  # one of them acts as the pod's ServiceAccount - which, with the default
  # readSecrets, reads every Secret in the cluster. Restrict who may use this
  # client at the provider: an application assignment, a group condition on
  # the client, or a provider that knows only the people meant to get in.
  oidc:
    # The provider's identity, and the exact string every token's `iss` must
    # equal. The browser is sent to the authorization endpoint its discovery
    # document names.
    issuer: ""

    # Where the pod fetches discovery from, when it cannot reach the issuer's
    # own address - the provider reached by a cluster-internal Service name
    # while browsers use its public one. The document must still name the
    # issuer. Empty means the issuer.
    discoveryURL: ""

    clientID: ""

    # The client secret, read from a Secret you create - never a value in this
    # file, where `helm get values` would print it. Leave `existingSecret`
    # empty for a public client; PKCE protects the exchange either way.
    clientSecret:
      existingSecret: ""
      key: client-secret

    # The console's callback **as the browser reaches it**, ending in
    # /api/auth/oidc/callback, registered at the provider byte for byte. With
    # an Ingress that is https://<host>/api/auth/oidc/callback; through a
    # port-forward, http://127.0.0.1:<port>/api/auth/oidc/callback.
    redirectURL: ""

    # Comma separated. Some providers emit the groups claim only when asked for
    # `groups` - Dex does.
    scopes: "openid,email,profile"

    # **Per provider**, which is why they are values: the claim that names the
    # person (empty = email) and the claim that carries the groups
    # (empty = groups).
    usernameClaim: ""
    groupsClaim: ""

    # Prepended to every group before the console asserts it, like
    # kube-apiserver's --oidc-groups-prefix. A name, never a permission.
    groupsPrefix: ""

    # How long a single sign-on session lives from the sign-in. Empty is the
    # console's 12h. It is also how long a group removed at the provider keeps
    # being asserted, because groups are read at sign-in.
    sessionMax: ""

  # Keep the shared password beside the identity provider. **Off, and that is
  # the decision**: a shared password next to a provider is a way in that
  # bypasses the provider, which nobody can attribute and nobody remembers to
  # turn off. With it off and `oidc.issuer` set, the console registers no
  # password route and draws no password. The cost is stated rather than found
  # later: if the provider never comes back, the way in is a `helm upgrade`
  # that sets this, which is a deliberate act with a record.
  localAccount: false

# ---------------------------------------------------------------------------
# The process
# ---------------------------------------------------------------------------

# The port-forward range the console may bind inside the pod. These are local
# to the pod: a forward opened here is reachable through the console, not from
# the cluster. The cap is per process, so this range is shared by everybody
# signed in - which is one of the single-user assumptions.
forwardPorts: "30000-30031"

# Clusters to mark read-only, comma-separated context names. With the generated
# kubeconfig there is exactly one context, so this is either empty or that
# name. It is a guardrail against a misclick, not a boundary - the marking does
# not stop a port-forward and does not stop the terminal.
readonlyClusters: ""

# KT_DIAG - extra startup logging. "1" makes the first 30 lines of the log the
# whole diagnosis, which is worth it on a first install.
diagnostics: ""

# Claude Code ships in the image and the console offers a control for it. In a
# pod reachable by more than one person this runs on one subscription, as one
# identity, with the pod's own credentials. Read-only by default.
claude:
  readOnly: true
  permissionMode: ""

extraEnv: []
# - name: KT_EXTRAS
#   value: ""

# ---------------------------------------------------------------------------
# Storage - the state directory, KT_STATE_DIR=/var/lib/kubetower
# ---------------------------------------------------------------------------
#
# What lives there: the rail's hotbars, the column layouts, the cluster names,
# the event archive and its settings, the node-shell image, the version note,
# and - when auth.passwordHash is empty - the drawn password's bcrypt hash.
#
# **The console is told which way this is set** (KT_STATE_PERSISTENT), because
# it cannot see a volume. With persistence off it offers nothing that would not
# survive a restart: no archive, no archive settings and no node-shell image
# setting, absent from the Settings page and from its API. The rail and the
# columns still work, for as long as the pod runs.
#
# **Off with a drawn password is refused at install**, because every restart
# would draw a new one and the old would stop working with nothing saying why.
# Turning persistence off therefore needs one of: auth.passwordHash,
# auth.existingSecret, or auth.oidc.issuer with auth.localAccount false - the
# three ways in that keep nothing on this disk.
#
# **With auth.existingSecret, that Secret must also carry KT_SESSION_SECRET.**
# The chart's own Secret always has one; yours has one only if you put it
# there. Without it the console draws a new key at every start, so every
# restart signs everybody out - and that is so with persistence on as well,
# because an environment-supplied password never reads a key from this disk.
# The chart cannot look inside a Secret it did not write, so this is said
# rather than refused; NOTES says it again on every install that names one.
persistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  existingClaim: ""

service:
  type: ClusterIP
  port: 5823
  annotations: {}

# Off. Deliberately, and this is not a formality: an Ingress in front of this
# publishes a console holding cluster credentials behind one shared password,
# on whatever the ingress controller answers on. If you turn it on, put TLS and
# something that authenticates in front of it.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: kubetower.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    # No CPU limit: the console's list refreshes are bursty and a limit turns
    # that into throttled latency on every page. Memory is capped because a
    # runaway is worth killing.
    memory: 1Gi

# uid 100 / gid 101 are what the image creates and what /var/lib/kubetower is
# chowned to. Changing them without changing the image breaks every write.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  # false, and honestly: the process writes to $HOME (the Claude config
  # directory and the AWS CLI cache) and to /tmp/kubetower. Setting it true
  # needs an emptyDir on each of those, which this chart does not yet do.
  readOnlyRootFilesystem: false

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30

# /readyz degrades when the kubeconfig stops reading or no context answers, so
# it is a real readiness signal rather than "the process is up".
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

extraVolumes: []
extraVolumeMounts: []

# ---------------------------------------------------------------------------
# Several replicas: the Valkey they share
# ---------------------------------------------------------------------------
#
# Deployed only when replicaCount is above one: a StatefulSet of one, a Service,
# a ConfigMap and a Secret. It holds nothing on disk, so a restart of it signs
# everybody out - one click each while the identity provider's own session is
# alive, which is what a restart of a single console costs too. The sessions
# and plans the consoles write into it are sealed with the session key, which
# Valkey never sees; a sign-in marker is a hash.
#
# **Its password is a Secret like any other**, so with the default
# rbac.readSecrets anybody who signs in can read it from the Secrets page and,
# with no NetworkPolicy in the way, connect to Valkey. What they find there is
# sealed or hashed; but the session key sits in this release's own Secret,
# which the same read reaches (see rbac.readSecrets). The Valkey password adds
# the power to delete every record - signing everybody out and forgetting which
# sign-in codes were used - and nothing that the Secrets read had not already
# given.
valkey:
  image:
    # The official image, BSD-3-Clause. Pinned by tag and by digest; the tag is
    # for a reader, the digest is what is pulled.
    repository: valkey/valkey
    tag: "9.1.2-alpine3.24@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11"
    pullPolicy: IfNotPresent

  # The password. **Empty means the chart draws one on the first install and
  # reads it back on every upgrade** (`lookup` on the Secret it wrote), so an
  # upgrade keeps it and signs nobody out.
  #
  # `lookup` answers only when Helm talks to a cluster: `helm template`,
  # `--dry-run` and GitOps tools that render without one (Argo CD among them)
  # see no Secret and draw a new password on every render. Applied, that
  # changes the Secret on every sync. Valkey and every console carry a checksum
  # of it, so all of them restart together rather than some keeping the old
  # password while pods started later use the new one - which would fail
  # requests on whichever pod was out of step. The cost is that each sync
  # signs everybody out. **Under those tools, name a Secret you manage here,
  # and set auth.sessionSecret or auth.existingSecret too**: the session key is
  # drawn the same way, and several consoles must share it.
  #
  # Any bytes are carried: the init container writes each one escaped into
  # Valkey's configuration, so a quote or a newline cannot end the line or add
  # a directive. An empty password is refused, because an empty requirepass
  # turns authentication off. Rotating the password inside a Secret you manage
  # needs a `kubectl rollout restart` of Valkey and of the consoles: the
  # chart hashes that Secret's name, not its contents, which it cannot read.
  existingSecret: ""
  existingSecretKey: password

  service:
    port: 6379

  # Valkey's own ceiling, below the container's memory limit, so that its
  # memory stays bounded. At the ceiling the key nearest its expiry goes first:
  # under pressure the short-lived sign-in markers and plans go long before a
  # session.
  maxmemory: 48mb

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 96Mi

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  nodeSelector: {}
  tolerations: []
