{{- if .Values.rbac.create }}
{{/*
The console's permissions.

Derived from what the code in thonicdev/kubetower asks the cluster for, not
from a convenience role:

  internal/resources/kinds.go   the list pages - one entry per kind below
  internal/helm/helm.go         Helm releases are Secrets, type=helm.sh/release.v1
  internal/metrics              metrics.k8s.io; Prometheus through the service
                                proxy (prom.go), or a port-forward (tunnel.go)
  internal/kubeletstats         nodes/proxy
  internal/terminal/exec.go     pods/exec
  internal/forward              pods/portforward
  internal/customresources      every CRD the cluster serves, dynamically
  internal/access               subjectaccessreviews, asked before every write
  internal/edit                 every write: patch, create, delete, and an
                                eviction (door.go)
  internal/actions/needs.go     what each action is reviewed as: patch on the
                                object, create on pods/eviction, create on jobs

test/console-needs.yaml lists those requests one by one, with the file each
comes from, and test/console-needs-check.py fails when a switch that should
grant one does not.

Not the built-in `view` ClusterRole: it excludes Secrets, which the Secrets
page and the Helm list both need, and it carries rules for things this console
never asks about. An explicit list is longer and says what it is for.

Not cluster-admin. Ever. Every request the console makes is made as this
ServiceAccount, whoever signed in: with single sign-on the console first asks
the cluster whether that person may, so this role is the ceiling of what
anybody gets; with the shared password, its holder gets all of it.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubetower.fullname" . }}
  labels:
    {{- include "kubetower.labels" . | nindent 4 }}
rules:
  # Asking the cluster whether a person may do a thing, before the console does
  # it (internal/access). A person signed in through single sign-on is asked
  # about by name and groups, in a SubjectAccessReview; without this rule that
  # review cannot be made, and every write of theirs is refused as unanswerable.
  #
  # Always granted, whatever the switches below say: it lets the console check
  # each person's rights before acting, rather than acting with its own. It is
  # a question and not a grant - the answer is the cluster's own RBAC, and a
  # review changes nothing. What it does reveal is what any user or group may
  # do, which is what `kubectl auth can-i --as` tells an administrator and what
  # the Access Control pages already show from the bindings.
  #
  # The shared password account and the desktop ask about the console itself,
  # in a SelfSubjectAccessReview, which needs no rule here: the built-in
  # system:basic-user role grants it to every authenticated identity.
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
{{- if .Values.rbac.read }}
  # Core workloads and the objects the drawer relates them to.
  - apiGroups: [""]
    resources:
      - pods
      - pods/log          # the log panel
      - pods/status
      - services
      - endpoints
      - namespaces        # the namespace selector, and it is cluster-scoped
      - nodes             # the nodes page and the overview's capacity
      - events            # the drawer's event list
      - persistentvolumeclaims
      - persistentvolumes
      - replicationcontrollers
      - serviceaccounts
      - resourcequotas
      - limitranges
      - podtemplates
      - configmaps
    verbs: ["get", "list", "watch"]
{{- if .Values.rbac.readSecrets }}
  # Secrets, and this is the rule to think about before the others.
  #
  # Two things need it: the Config > Secrets list, and the Helm release list,
  # which is `get secrets --field-selector type=helm.sh/release.v1` and has no
  # other implementation - internal/helm/helm.go:163 says a caller without
  # `list` on secrets is told there are no releases, which is the wrong answer
  # rather than a refusal.
  #
  # It is cluster-wide read of every Secret in the cluster. Set
  # rbac.readSecrets=false to drop it; those two pages then report a denial,
  # which is at least an honest one.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
{{- end }}
  - apiGroups: ["apps"]
    resources:
      - deployments
      - deployments/status
      - statefulsets
      - statefulsets/status
      - daemonsets
      - daemonsets/status
      - replicasets       # internal/changes reads these for rollout history
      - controllerrevisions
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingressclasses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
    verbs: ["get", "list", "watch"]
  # The Access Control pages. Reading RBAC is reading who can do what; it is
  # not itself a grant, and a console that cannot show it cannot answer the
  # question people open it for.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "clusterroles", "rolebindings", "clusterrolebindings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "volumeattachments", "csidrivers", "csinodes", "csistoragecapacities"]
    verbs: ["get", "list", "watch"]
  # The CRD list itself, which is how the console knows what custom resources
  # exist and which printer columns to render. Reading the definitions does not
  # grant reading the objects - that is rbac.customResources below.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
{{- end }}
{{- if .Values.rbac.metrics }}
  # The live CPU and memory columns. Answers only where metrics-server is
  # installed; where it is not, the console says "no metrics backend" and that
  # is a different fact from being refused.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
{{- end }}
{{- if .Values.rbac.customResources }}
  # Every custom resource in the cluster, read-only.
  #
  # A wildcard, because it has to be: the console renders whatever CRDs the
  # cluster serves, discovered at runtime, and a fixed list cannot name a kind
  # installed tomorrow. It is get/list/watch and nothing else - but it is still
  # "read every object of every kind", which includes any CRD that stores a
  # credential in its spec. Off by default for that reason.
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
{{- end }}
{{- if .Values.rbac.write }}
  # Editing. The drawer's manifest editor (a merge patch, internal/edit), the
  # create and delete controls, and the actions in internal/actions: restart
  # and scale patch the workload, suspend and resume patch the CronJob,
  # trigger creates a Job.
  #
  # Granted to the pod, therefore the ceiling for everybody who signs in. The
  # API server's audit log attributes every change to this ServiceAccount; the
  # console's own log names the person behind each one when they signed in
  # through single sign-on, and names nobody for the shared password.
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets", "persistentvolumeclaims", "serviceaccounts", "replicationcontrollers"]
    verbs: ["create", "update", "patch", "delete"]
  # Cordon, uncordon and drain set spec.unschedulable with a patch on the node
  # (internal/actions/needs.go). A patch on a node can also change its labels
  # and taints - where workloads may be scheduled - which is no more than the
  # rest of this switch already amounts to.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["patch"]
  # Evict, and the second half of a drain: an Eviction posted to each pod
  # (internal/edit/door.go), which a PodDisruptionBudget can refuse - unlike a
  # delete.
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale", "statefulsets", "statefulsets/scale", "daemonsets", "replicasets"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["create", "update", "patch", "delete"]
{{- end }}
{{- if .Values.rbac.exec }}
  # A shell in any pod, and a socket to any pod's port.
  #
  # This is the switch that turns a viewer into a way into the cluster. The
  # console's terminal runs as this ServiceAccount; internal/forward's own
  # comment says a port-forward "creates nothing" in RBAC's spelling and that
  # what travels through the tunnel may be anything at all. Both are true of
  # everybody who can sign in. It is also the metrics layer's fallback route
  # to Prometheus (internal/metrics/tunnel.go) when rbac.prometheusProxy is
  # off or the service proxy is refused.
  - apiGroups: [""]
    resources: ["pods/exec", "pods/attach", "pods/portforward"]
    verbs: ["create", "get"]
{{- end }}
{{- if .Values.rbac.prometheusProxy }}
  # Prometheus, through the API server's service proxy (internal/metrics/
  # prom.go: /api/v1/namespaces/<ns>/services/<name>:<port>/proxy/...). The
  # verb is the request's, and the console only reads.
  #
  # It is a proxy to every Service in the cluster, not only Prometheus - a
  # ClusterRole cannot name a Service it has not discovered yet. GET requests
  # only, but to any HTTP endpoint that trusts the cluster network.
  - apiGroups: [""]
    resources: ["services/proxy"]
    verbs: ["get"]
{{- end }}
{{- if .Values.rbac.nodeProxy }}
  # The kubelet's own stats API, through the API server's node proxy
  # (internal/kubeletstats). It is a proxy to every kubelet on every node - a
  # far wider capability than the page that uses it needs to imply.
  - apiGroups: [""]
    resources: ["nodes/proxy", "nodes/stats", "nodes/metrics"]
    verbs: ["get"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubetower.fullname" . }}
  labels:
    {{- include "kubetower.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubetower.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubetower.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
