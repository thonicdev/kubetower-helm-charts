{{- /*
Optional, off by default: networkPolicy.enabled.

Ingress only. Two policies:

  - the console's pods admit their one port, from networkPolicy.consoleFrom,
    or from anywhere when that list is empty - the ingress controller, a
    port-forward and the kubelet's probes all arrive there, and where they
    come from differs per cluster. Every other port on the pod is closed;
  - with several replicas, Valkey admits its port from the console's pods of
    this release, and from nothing else. Its password is a Secret the default
    rbac.readSecrets lets anybody who signs in read; this is what stops that
    password being enough to connect.

No egress policy. The console reaches the API server, the identity provider,
Valkey, Prometheus and whatever a port-forward points at, and the addresses of
the first two depend on the cluster and the provider; a policy honest about
that permits nearly everything, and one that is not breaks the console.

A NetworkPolicy does nothing on a cluster whose network plugin does not
enforce them, and says nothing about it either. Check yours does.
*/ -}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kubetower.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubetower.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kubetower.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- with .Values.networkPolicy.consoleFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if include "kubetower.several" . }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kubetower.valkeyName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubetower.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kubetower.valkeySelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "kubetower.selectorLabels" . | nindent 14 }}
      ports:
        - port: valkey
          protocol: TCP
{{- end }}
{{- end }}
