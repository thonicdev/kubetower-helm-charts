{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubetower.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubetower.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The legacy auto-mount is off and the Deployment projects a short-lived token
# instead. Not a refinement: the auto-mounted token is a Secret that does not
# expire, and this pod's identity is the identity every signed-in person
# borrows, so a token with an hour on it is the difference between a leak that
# ends and one that does not.
automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
{{- end }}
