{{- $_ := include "kubetower.fillLaterDefaults" . -}}
{{- /*
The Valkey password, when this chart draws it. A file of its own so that the
consoles and Valkey can each carry a checksum of exactly this object, and a
changed password rolls every pod that reads it instead of leaving some with
the old one - see kubetower.valkeySecretChecksum.
*/ -}}
{{- if and (include "kubetower.several" .) (not .Values.valkey.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubetower.valkeyName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubetower.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Drawn once and kept across upgrades - see kubetower.valkeyPassword for how,
  # and for the tools under which it cannot be kept.
  password: {{ include "kubetower.valkeyPassword" . | quote }}
{{- end }}
