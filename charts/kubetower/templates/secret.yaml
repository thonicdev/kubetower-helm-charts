{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubetower.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubetower.labels" . | nindent 4 }}
type: Opaque
stringData:
  # A bcrypt hash: auth.passwordHash, or the one of the password this chart
  # draws (kubetower.drawnPassword), so that the console never draws one and
  # prints it in its log. Absent only with single sign-on and no shared
  # password, where the console offers no password route at all
  # (cmd/kubetower/main.go frontDoor: "the environment wins, and the file is
  # the fallback").
  {{- if .Values.auth.passwordHash }}
  KT_PASSWORD_HASH: {{ .Values.auth.passwordHash | quote }}
  {{- else if include "kubetower.drawsPassword" . }}
  KT_PASSWORD_HASH: {{ (include "kubetower.drawnPassword" . | fromJson).hash | quote }}
  {{- end }}
  # Always set, so that a restart does not sign the operator out. Drawn once
  # and preserved across upgrades - see kubetower.sessionSecret.
  KT_SESSION_SECRET: {{ include "kubetower.sessionSecret" . | quote }}
{{- end }}
