{{- $_ := include "kubetower.fillLaterDefaults" . -}}
{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubetower.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubetower.labels" . | nindent 4 }}
type: Opaque
stringData:
  # A bcrypt hash or nothing. When it is nothing the variable is absent from
  # the pod, which is what makes the binary fall back to the credentials file
  # in the state directory and draw a password on first start
  # (cmd/kubetower/main.go frontDoor: "the environment wins, and the file is
  # the fallback"). An empty KT_PASSWORD_HASH would be the same as absent to
  # that code, but the Secret would then claim to hold a password it does not.
  {{- if .Values.auth.passwordHash }}
  KT_PASSWORD_HASH: {{ .Values.auth.passwordHash | quote }}
  {{- end }}
  # Always set, so that a restart does not sign the operator out. Drawn once
  # and preserved across upgrades - see kubetower.sessionSecret.
  KT_SESSION_SECRET: {{ include "kubetower.sessionSecret" . | quote }}
{{- end }}
