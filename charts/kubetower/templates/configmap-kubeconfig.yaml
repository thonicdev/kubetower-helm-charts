{{- if include "kubetower.kubeconfigGenerated" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubetower.fullname" . }}-kubeconfig
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubetower.labels" . | nindent 4 }}
data:
  # A kubeconfig that means "in-cluster", written out by hand - for the
  # desktop profile only (serverProfile: false).
  #
  # The server profile has no use for it: under --incluster the console reads
  # this pod's own ServiceAccount, as client-go's InClusterConfig does, and
  # does not read KUBECONFIG at all. The desktop profile reads only
  # KUBECONFIG, so for it this file is written from the three things every pod
  # is given:
  #
  #   the API server        kubernetes.default.svc, routed by the cluster's DNS
  #   the CA                /var/run/secrets/.../ca.crt
  #   the identity          /var/run/secrets/.../token, re-read as it rotates
  #
  # `tokenFile` and not `token`: the Deployment projects an expiring token, and
  # client-go re-reads the file when it changes. A token pasted in here would
  # be dead an hour after the install.
  config: |
    apiVersion: v1
    kind: Config
    current-context: {{ .Values.kubeconfig.contextName }}
    clusters:
      - name: {{ .Values.kubeconfig.contextName }}
        cluster:
          server: {{ .Values.kubeconfig.server }}
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    users:
      - name: {{ .Values.kubeconfig.contextName }}
        user:
          tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    contexts:
      - name: {{ .Values.kubeconfig.contextName }}
        context:
          cluster: {{ .Values.kubeconfig.contextName }}
          user: {{ .Values.kubeconfig.contextName }}
          namespace: {{ .Release.Namespace }}
{{- end }}
