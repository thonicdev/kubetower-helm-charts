{{- /*
The password this chart drew (kubetower.drawnPassword), for the first sign-in.
A Secret of its own, never read by the pod: the pod gets only the hash, through
the release's Secret. Rendered while the chart still holds the password; delete
it once read, and later upgrades keep the hash without drawing again.
*/ -}}
{{- if include "kubetower.drawsPassword" . }}
{{- $pair := include "kubetower.drawnPassword" . | fromJson }}
{{- if $pair.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubetower.initialPasswordName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubetower.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ $pair.password | quote }}
{{- end }}
{{- end }}
