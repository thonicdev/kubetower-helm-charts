{{- $_ := include "kubetower.fillLaterDefaults" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubetower.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubetower.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # ClusterIP. A LoadBalancer or a NodePort here publishes a console holding
  # cluster credentials behind one shared password; `kubectl port-forward` is
  # the default way in, and it already authenticates the operator against the
  # API server before the login page is ever reached.
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "kubetower.selectorLabels" . | nindent 4 }}
