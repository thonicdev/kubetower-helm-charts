# What a red cross here means: the chart would install something different from
# what it says it installs.
#
# It does not install anything. Nothing in this workflow reaches a cluster, so
# nothing here proves the chart works - only that it renders, and that what it
# renders does not grant more than the README claims. The install path is tested
# by hand against a real cluster, and that is stated rather than implied.
name: chart
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: helm lint and template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      # The defaults are what most people install, so they are linted first and
      # on their own - a failure here is a failure for everybody.
      - name: Lint the defaults
        run: helm lint ./charts/kubetower

      # And every dangerous toggle on, because a template that only renders in
      # its default shape has whole branches nothing has ever parsed.
      - name: Lint with every toggle on
        run: |
          helm lint ./charts/kubetower \
            --set rbac.write=true --set rbac.exec=true --set rbac.nodeProxy=true \
            --set rbac.customResources=true --set rbac.readSecrets=true \
            --set rbac.metrics=true --set serverProfile=true \
            --set ingress.enabled=true --set ingress.hosts[0].host=example.test

      # Single sign-on on, with every optional value set, because its whole
      # block is behind `if .issuer` and nothing else renders it.
      - name: Lint with single sign-on configured
        run: |
          helm lint ./charts/kubetower \
            --set auth.oidc.issuer=https://idp.example/dex --set auth.oidc.clientID=kubetower \
            --set auth.oidc.redirectURL=https://kubetower.example/api/auth/oidc/callback \
            --set auth.oidc.clientSecret.existingSecret=kubetower-oidc \
            --set auth.oidc.discoveryURL=http://dex.dex.svc:5556/dex \
            --set auth.oidc.groupsClaim=groups --set auth.oidc.usernameClaim=email \
            --set auth.oidc.groupsPrefix=oidc: --set auth.oidc.sessionMax=8h \
            --set auth.localAccount=true

      # `helm lint` does not parse what it renders; it can pass on a template
      # that produces invalid YAML. This is the parse.
      - name: The rendered manifests are valid YAML
        run: |
          helm template kubetower ./charts/kubetower --set serverProfile=true \
            | python -c 'import sys,yaml; print(sum(1 for d in yaml.safe_load_all(sys.stdin) if d), "documents parsed")'

      # Several replicas: the Valkey StatefulSet, its Service and Secret, and
      # the three variables the console reads. Everything about it is behind
      # `replicaCount > 1`, so nothing above renders a line of it.
      - name: Several replicas render, and parse
        run: |
          helm lint ./charts/kubetower --set replicaCount=2 --set persistence.enabled=false \
            --set auth.oidc.issuer=https://idp.example/dex --set auth.oidc.clientID=kubetower \
            --set auth.oidc.redirectURL=https://kubetower.example/api/auth/oidc/callback
          helm template kubetower ./charts/kubetower --set replicaCount=2 --set persistence.enabled=false \
              --set auth.oidc.issuer=https://idp.example/dex --set auth.oidc.clientID=kubetower \
              --set auth.oidc.redirectURL=https://kubetower.example/api/auth/oidc/callback \
            | python -c '
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(sys.stdin) if d]
          kinds = sorted(d["kind"] + "/" + d["metadata"]["name"] for d in docs)
          assert "StatefulSet/kubetower-valkey" in kinds, kinds
          assert "Secret/kubetower-valkey" in kinds, kinds
          env = {e["name"] for d in docs if d["kind"] == "Deployment"
                 for e in d["spec"]["template"]["spec"]["containers"][0]["env"]}
          assert {"KT_REPLICATED", "KT_VALKEY_ADDR", "KT_VALKEY_PASSWORD"} <= env, env
          print(len(docs), "documents parsed, Valkey and its three variables present")'

      # And the ones the chart refuses. Each must fail, and fail naming its
      # reason: a `fail` nobody has seen fire is a refusal nobody knows is
      # connected - the rbac check below runs its --self-test for the same
      # reason.
      - name: Incoherent replica configurations are refused
        run: |
          set -u
          oidc="--set auth.oidc.issuer=https://idp.example/dex --set auth.oidc.clientID=k --set auth.oidc.redirectURL=https://k.example/api/auth/oidc/callback"
          refused() {
            want="$1"; shift
            if out=$(helm template kubetower ./charts/kubetower "$@" 2>&1); then
              echo "NOT REFUSED: $*"; exit 1
            fi
            echo "$out" | grep -q "$want" || { echo "refused without naming '$want': $out"; exit 1; }
            echo "refused, naming '$want': $*"
          }
          refused "persistence.enabled is true" --set replicaCount=2 $oidc
          refused "serverProfile is false" --set replicaCount=2 --set persistence.enabled=false --set serverProfile=false $oidc
          refused "no auth.passwordHash" --set replicaCount=2 --set persistence.enabled=false
          refused "no auth.passwordHash" --set replicaCount=2 --set persistence.enabled=false --set auth.localAccount=true $oidc
          refused "read by nothing" --set valkey.existingSecret=mine
          # The control: the same values made coherent render.
          helm template kubetower ./charts/kubetower --set replicaCount=2 --set persistence.enabled=false $oidc > /dev/null
          helm template kubetower ./charts/kubetower --set replicaCount=2 --set persistence.enabled=false \
            --set auth.passwordHash='$2a$12$abcdefghijklmnopqrstuv' > /dev/null
          echo "the coherent configurations render"

  rbac:
    name: the ClusterRole grants nothing it should not
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: pip install pyyaml
      # --self-test first: it refuses a deliberately bad role and fails the job
      # if it does not. A checker nobody has seen fail is a checker nobody knows
      # is connected.
      - run: python test/rbac-check.py --self-test

  public:
    name: nothing here cites what a stranger cannot open
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # This repository is public. Its instructions say to link the console
      # freely and anything private never, and that was broken twice in its first
      # two days - once by a copied template naming private repositories, once by
      # comments citing a decision by its identifier in a private register. Both
      # were caught by somebody reading. A rule only a reader enforces is a
      # comment, so it is a job.
      #
      # A pull request's own `Closes` line may name a private issue; that is in
      # the PR body, which this job does not read, and it is the one exception.
      - name: no private identifiers or repository names in the tree
        run: |
          pattern='kubetower-docs#[0-9]+|claude-work#[0-9]+|\bD-[0-9]+\b|\bO-[0-9]+\b|\bFX-[0-9]+\b|SERVER-MODE-THREAT-MODEL|claude-plugins|Claude-global'
          if git grep -nE "$pattern" -- . ':!.github/workflows/chart.yml'; then
            echo "::error::a private reference is in a public repository - state the reasoning in plain words instead"
            exit 1
          fi
          echo "no private references"
